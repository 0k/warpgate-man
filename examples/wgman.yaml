# wgman.yaml — declarative Warpgate configuration.
#
# warpgate-man reads this file and synchronises one or more Warpgate servers so
# their targets, target-groups, users and roles match what is described here.
#
#   warpgate-man --config wgman.yaml diff           # show what would change
#   warpgate-man --config wgman.yaml apply          # create / update
#   warpgate-man --config wgman.yaml apply --prune  # + delete what is not here
#
# The same file also serves the end-user command, which only reads:
#
#   warpgate-man --config wgman.yaml ssh-config     # ssh stanzas for MY targets
#
# Secrets must be referenced through environment variables: ${VAR}. They are
# interpolated at load time; never write secrets in clear text in this file.

# ── 1. Warpgate servers ──────────────────────────────────────────────────────
# 'api-key' is YOUR Warpgate token (sent as X-Warpgate-Token). What you may
# run follows from what that token is:
#   - a personal API token (web UI -> profile -> API tokens) suffices for
#     'ssh-config', which lists the targets your roles grant you;
#   - 'diff' / 'apply' additionally require admin rights.
# The server's global admin token (--enable-admin-token) is bound to no user,
# so it administers fine but 'ssh-config' refuses it.
#
# 'api-key' is OPTIONAL: it authenticates toward the bastion rather than
# identifying a server. A config written for an end user may declare a
# server by 'name', 'url' and 'ssh-host' alone -- enough for
# 'ssh-config --from-odoo', which contacts Warpgate not at all. Commands
# that do authenticate refuse with a message naming the server.
#
# An end user needs nothing but this section: everything below describes
# desired state and is used by diff/apply only.
servers:
  - name: prod                      # logical id, used by --server prod
    url: https://warpgate.example.com:8888
    api-key: ${WG_PROD_TOKEN}
    verify-tls: true                # optional, default true

  - name: staging
    url: https://wg-staging.example.com:8888
    api-key: ${WG_STAGING_TOKEN}

# ── 1b. Optional: Odoo as source of desired state ────────────────────────────
# When present, diff/apply query Odoo and merge what they find into the state
# described below (a name defined on both sides is an error, not an override).
# `warpgate-man fetch` prints the same result as YAML without writing anything.
#
# What is read:
#   - targets: maintenance.equipment records matching targets.domain; their
#     'ssh_target' field ([user@]DOMAIN_OR_IP[:PORT], defaults root/22) gives
#     host/port/account, the record name gives the target name, auth publickey.
#   - users:   res.users records matching each users[].domain, one Warpgate
#     user per Odoo login; roles accumulate when several entries match.
#   - keys:    the ssh.key records of those users, pushed as their public keys.
#   - roles:   every role named below is auto-declared (sharing a role between
#     a user and a target is what grants access).
#
# Selection is expressed as raw Odoo domains, forwarded verbatim to
# search_read. Connection overrides: --odoo-url/--odoo-db/--odoo-user. There
# is no --odoo-password on purpose (it would leak into ps / shell history).
#odoo:
#  url: https://odoo.example.com
#  db: mydb                       # optional: omit and the server is asked,
#                                 # which works when it hosts exactly one
#                                 # database (several, or a server with
#                                 # database listing disabled, is an error
#                                 # telling you to name it here)
#  user: sync@example.com
#  # password: ${ODOO_PASSWORD}   # omit to be prompted interactively
#  verify-tls: true               # optional, default true
#
#  targets:
#    domain: [["ssh_target", "!=", false]]    # this is the default
#    roles: [sysadmin]                        # granted to every Odoo target
#
#  users:
#    - domain: [["groups_id", "in", [12]]]    # e.g. an Odoo "sysadmins" group
#      roles: [sysadmin]
#    - domain: [["login", "=", "alice@example.com"]]
#      roles: [developers]

# ── 2. Desired state: targets organised in groups ────────────────────────────
# "folders / files" structure: groups contain targets. Maps onto Warpgate's
# native target-groups (group_id). Access is granted through roles, not groups
# (groups are purely organisational / UI).
target-groups:
  - name: databases
    color: info                     # optional UI color: primary/secondary/success/danger/warning/info
    targets:
      - name: pg-main
        kind: ssh                   # ssh | http | mysql | postgres | kubernetes
        host: 10.0.0.5
        port: 22
        username: postgres
        auth: publickey             # publickey | password | iam_role
        roles: [dba, admin]         # roles allowed to reach this target

      - name: mysql-reporting
        kind: mysql
        host: 10.0.0.6
        port: 3306
        username: reporting
        auth:
          kind: password
          password: ${MYSQL_REPORTING_PW}
        roles: [analysts]

  - name: web-servers
    color: success
    targets:
      - name: app-frontend
        kind: http
        url: http://10.0.1.10:8080
        external-host: app.warpgate.example.com
        roles: [developers]

# Ungrouped targets live at the root (group_id = null).
targets:
  - name: jump-bastion
    kind: ssh
    host: 192.168.1.1
    port: 22
    username: root
    auth: publickey
    roles: [admin]

# ── 3. Roles ─────────────────────────────────────────────────────────────────
roles:
  - name: admin
  - name: dba
  - name: analysts
  - name: developers
    default: true                   # is_default: auto-assigned to new users

# ── 4. Users ─────────────────────────────────────────────────────────────────
users:
  - name: alice                     # → username
    roles: [admin, dba]
    public-keys:                    # optional, authorised SSH keys
      - ssh-ed25519 AAAAC3Nz... alice@laptop
  - name: bob
    roles: [developers]
  - name: carol
    roles: [analysts]

# ── 5. Prune scope (optional) ────────────────────────────────────────────────
# Controls what `apply --prune` (and `diff --prune`) is allowed to delete.
# Without this section, --prune deletes TARGETS ONLY — the safe default: a
# full prune would happily delete the admin user the moment the desired state
# is incomplete (e.g. an Odoo selection that matches no users).
#
# Each kind flag turns deletion on/off; keep-* lists protect individual names
# even when that kind is pruned.
#prune:
#  targets: true                    # default true
#  target-groups: false             # default false
#  roles: false                     # default false
#  users: false                     # default false
#  keep-users: [admin]              # never delete these users, even if pruned
#  keep-roles: [admin]
#  keep-targets: []
#  keep-target-groups: []
